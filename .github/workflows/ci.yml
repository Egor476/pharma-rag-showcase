name: Pharma Product RAG CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:   
  
  ci-checks:
    runs-on: ubuntu-latest
    
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf $AGENT_TOOLSDIRECTORY
      
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint Python Code with Ruff
        run: |
          ruff check scripts/

      - name: Validate XML/DITA Structure
        run: |
          python scripts/validate-xml.py

      - name: Validate Prompt JSON against Schema
        run: |
          python scripts/validate-prompts.py

      - name: Run XML-to-YAML Taxonomy Conversion
        run: |
          python scripts/taxonomy-converter.py

      - name: Verify Git Status (Check if generated YAML matches expected state)
        run: |
          git diff --exit-code schemas/pharma-product-taxonomy.yaml || echo "Taxonomy YAML generated or updated successfully."

      - name: Run DITA Preprocessor (XML-to-JSON Topics)
        run: |
          python scripts/dita-preprocessor.py

      - name: Upload Processed DITA Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dita-processed-topics
          path: data/dita-processed/
          retention-days: 7